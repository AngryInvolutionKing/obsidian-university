<header class="masthead"><span class="brand">云游记 &nbsp; / &nbsp; SKY JOURNAL</span><span class="edition">VOL. 001 &nbsp; · &nbsp; 花果山航空</span></header>
<section class="headline"><div class="eyebrow">THE MONKEY KING TAKES FLIGHT</div><h1>大圣，起飞。</h1><p>十万八千里，今天换个飞法。</p><span class="seal">齐天大圣</span></section>
<footer class="bottom"><div class="caption"><strong>穿过云海，自在如风。</strong><br>花果山 HGS &nbsp; ────── &nbsp; 南天门 NTM</div><div class="controls"><button id="pause" type="button" aria-label="暂停动画">Ⅱ 暂停</button><button id="night" type="button" aria-pressed="false">☾ 夜航</button><label for="speed">航速 <input id="speed" type="range" min="0.5" max="2" value="1" step="0.25"><span class="readout" id="speedValue">1×</span></label></div></footer>
</main>
<script>
const world = document.getElementById('world');
const pauseButton = document.getElementById('pause');
const nightButton = document.getElementById('night');
const speed = document.getElementById('speed');
let paused = false;
pauseButton.addEventListener('click', () => {
  paused = !paused;
  world.classList.toggle('paused', paused);
  pauseButton.textContent = paused ? '▶ 继续' : 'Ⅱ 暂停';
  pauseButton.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
});
nightButton.addEventListener('click', () => {
  const night = document.body.classList.toggle('night');
  nightButton.textContent = night ? '☀ 日航' : '☾ 夜航';
  nightButton.setAttribute('aria-pressed', String(night));
});
const movingElements = [...document.querySelectorAll('.flight,.scarf-end,.tail,.feather,.propeller,.cloud-near,.cloud-mid,.cloud-far,.speed-lines,.blink,.sun-halo,.spark')];
const baseDurations = movingElements.map(element => parseFloat(getComputedStyle(element).animationDuration));
speed.addEventListener('input', () => {
  document.getElementById('speedValue').textContent = speed.value + '×';
  movingElements.forEach((element, index) => { element.style.animationDuration = baseDurations[index] / Number(speed.value) + 's'; });
});
</script>
