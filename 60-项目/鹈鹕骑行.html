<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海岸骑行 · Pelican Pedal Club</title>
  <style>
    :root{color-scheme:light;--ink:#244a47;--paper:#f7f4e9;--orange:#e87343}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}
    .page{max-width:1440px;margin:auto;padding:32px 5vw 24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #244a4727;padding-bottom:20px}
    .brand{font-size:12px;letter-spacing:3px;font-weight:700;display:flex;align-items:center;gap:12px}
    .brand-mark{width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:19px}
    .edition{font-size:11px;letter-spacing:2px;opacity:.65}
    .intro{display:flex;align-items:end;justify-content:space-between;margin:35px 0 22px;gap:20px}
    .eyebrow{font-size:11px;letter-spacing:3px;color:#a15b38;margin-bottom:11px}
    h1{font-size:clamp(30px,4.8vw,62px);line-height:1.12;letter-spacing:-2px;margin:0;font-weight:600}
    .intro p{font-size:13px;line-height:1.9;margin:0;opacity:.7}
    .scene{position:relative;border:1px solid #244a4725;border-radius:22px;overflow:hidden;background:#d9eae2;box-shadow:0 12px 40px #244a4708}
    .scene>svg{width:100%;display:block;max-height:68vh;min-height:310px}
    .scene-label{position:absolute;top:23px;left:26px;font-size:10px;letter-spacing:2px;display:flex;align-items:center;gap:8px;z-index:1}
    .dot{width:6px;height:6px;border-radius:50%;background:#e87343;box-shadow:0 0 0 4px #e8734315}
    .badge{position:absolute;right:23px;top:20px;border:1px solid #244a4755;border-radius:50%;width:66px;height:66px;display:grid;place-content:center;text-align:center;transform:rotate(12deg);font-size:9px;letter-spacing:2px;line-height:1.65}
    .badge b{font-size:21px;font-weight:500}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:20px 3px}
    .caption{font-size:12px;letter-spacing:1px}.caption span{color:#9a7055;margin-right:12px;font-family:monospace}
    .controls{display:flex;align-items:center;gap:22px;font-size:12px}
    button{font:inherit;border:1px solid #244a4740;border-radius:30px;color:var(--ink);background:transparent;padding:9px 17px;cursor:pointer;min-width:92px}
    button:hover{background:#e4e7da}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:5px}
    label{display:flex;align-items:center;gap:10px}input{width:100px;accent-color:#d96c40;cursor:pointer}output{font-variant-numeric:tabular-nums;min-width:31px}
    footer{display:flex;justify-content:space-between;border-top:1px solid #244a4727;padding-top:17px;font-size:10px;letter-spacing:2px;opacity:.55}
    @media(max-width:650px){.page{padding:20px 5vw}.edition{display:none}.intro{margin-top:26px;align-items:start;flex-direction:column}.intro p br{display:none}.scene>svg{min-height:330px}.badge{width:49px;height:49px;font-size:7px}.badge b{font-size:15px}.scene-label{font-size:8px;left:18px;top:20px}.toolbar{align-items:start;flex-direction:column;gap:17px}.controls{width:100%;justify-content:space-between}footer{font-size:8px;letter-spacing:1px}h1{letter-spacing:-1px}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><span class="brand-mark">↗</span> PELICAN PEDAL CLUB</div>
      <div class="edition">COASTAL JOURNAL / NO. 001</div>
    </header>
    <section class="intro">
      <div><div class="eyebrow">海风、车轮，和一只鹈鹕</div><h1>今天，慢慢骑。</h1></div>
      <p>沿着海岸线，把日子踩成圆。<br>没有目的地，也是一种好天气。</p>
    </section>
    <div class="scene">
      <div class="scene-label"><span class="dot"></span> A LITTLE RIDE BY THE SEA</div>
      <div class="badge">SEA BREEZE<b>↗</b>GOOD DAYS</div>
      <svg id="art" viewBox="0 0 1000 620" role="img" aria-labelledby="art-title art-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="art-title">鹈鹕骑着橙色自行车在海边兜风</title>
        <desc id="art-desc">一只戴着绿色小帽、系着橙色围巾的白色鹈鹕，双脚交替踩踏自行车，车轮转动，云朵与海岸向后移动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e2eee3"/><stop offset="1" stop-color="#c7e3db"/></linearGradient>
          <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#9acac2"/><stop offset="1" stop-color="#bedbd0"/></linearGradient>
          <pattern id="wave" width="160" height="36" patternUnits="userSpaceOnUse"><path d="M10 20h38m40-10h45" fill="none" stroke="#e2f0df" stroke-width="2" stroke-linecap="round" opacity=".65"/></pattern>
          <pattern id="road" width="220" height="100" patternUnits="userSpaceOnUse"><path d="M20 56h90" stroke="#f8f2df" stroke-width="4" stroke-linecap="round"/><path d="M150 17h12m35 57h3" stroke="#adad91" stroke-width="2" stroke-linecap="round" opacity=".55"/></pattern>
          <g id="cloud" fill="#f6f7e9"><path d="M0 22C-2 9 15 4 25 10C33-10 67-5 70 13C89 7 103 16 102 25H0Z"/></g>
          <g id="wheel-lines" stroke="#899d91" stroke-width="1.4" opacity=".8">
            <path d="M0-70V70M-70 0H70M-49.5-49.5l99 99M-49.5 49.5l99-99M-26.8-64.7l53.6 129.4M-64.7-26.8l129.4 53.6M-64.7 26.8l129.4-53.6M-26.8 64.7l53.6-129.4"/>
            <circle r="58" fill="none" stroke="#ced2ba" stroke-width="1"/>
            <path d="M-12-67H12" stroke="#fbf7e5" stroke-width="4" stroke-linecap="round"/>
          </g>
          <g id="grass" fill="none" stroke="#65897c" stroke-linecap="round" stroke-width="3"><path d="M0 0q-2-18-10-27M0 0q3-28 11-34M0 0q13-17 19-19"/></g>
        </defs>
        <path fill="url(#sky)" d="M0 0h1000v620H0z"/>
        <circle cx="772" cy="135" r="56" fill="#f6d38a"/><circle cx="772" cy="135" r="72" fill="none" stroke="#f8e3b1" opacity=".55"/>
        <g id="clouds"><use href="#cloud" x="110" y="100" opacity=".8"/><use href="#cloud" x="420" y="70" transform="translate(160 18) scale(.75)" opacity=".65"/><use href="#cloud" x="930" y="125" opacity=".8"/></g>
        <path d="M0 302Q110 257 215 293T448 289T700 280T1000 287V365H0Z" fill="#9ebcaf" opacity=".6"/>
        <path d="M0 320Q110 291 220 313T450 304T740 313T1000 309V365H0Z" fill="#7eaa9d" opacity=".6"/>
        <path d="M0 329H1000V461H0Z" fill="url(#sea)"/>
        <path d="M0 348H1000V454H0Z" fill="url(#wave)"/>
        <g id="sailboat" transform="translate(843 354)"><path d="M-20 0h43l-9 9H-12Z" fill="#6b9185"/><path d="M2-43V-5H-19Z" fill="#f5f3dd"/><path d="M6-33V-5H22Z" fill="#e5d3a9"/><path d="M2-46V2" stroke="#6b9185" stroke-width="2"/></g>
        <g fill="none" stroke="#61867c" stroke-width="2.2" stroke-linecap="round"><path id="bird1" d="M140 206q10-10 20 0q10-10 20 0"/><path id="bird2" d="M200 170q7-7 14 0q7-7 14 0"/></g>
        <path d="M0 450Q230 427 450 447T1000 437V620H0Z" fill="#e4ddbc"/>
        <path d="M0 489Q250 480 510 489T1000 482V620H0Z" fill="#cecdb4"/>
        <path d="M0 500H1000V620H0Z" fill="url(#road)"/>
        <path d="M0 485Q250 476 510 485T1000 478" fill="none" stroke="#f6edce" stroke-width="5"/>
        <g id="plants"><use href="#grass" x="100" y="472"/><use href="#grass" x="842" y="467"/><use href="#grass" x="1130" y="472"/></g>
        <ellipse id="shadow" cx="514" cy="534" rx="233" ry="14" fill="#49685a" opacity=".13"/>
        <g id="rider">
          <!-- Far leg sits behind the bicycle frame. -->
          <path id="leg-back" d="M475 307L465 381L493 430" fill="none" stroke="#c98437" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="foot-back" fill="#c98437"/>
          <g stroke="#294e49" fill="none">
            <circle cx="350" cy="450" r="79" stroke-width="10"/><circle cx="684" cy="450" r="79" stroke-width="10"/>
            <circle cx="350" cy="450" r="72" stroke="#f7efda" stroke-width="4"/><circle cx="684" cy="450" r="72" stroke="#f7efda" stroke-width="4"/>
          </g>
          <g transform="translate(350 450)"><g id="spokes-back"><use href="#wheel-lines"/></g></g>
          <g transform="translate(684 450)"><g id="spokes-front"><use href="#wheel-lines"/></g></g>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M347 430Q418 431 506 426Q528 440 506 455L350 461Z" stroke="#6c8070" stroke-width="3"/>
            <path d="M350 450L454 350L509 443H350L454 350H624L509 443" stroke="#cf613d" stroke-width="10"/>
            <path d="M457 352L619 352M360 443L452 361" stroke="#ed9160" stroke-width="3"/>
            <path d="M684 450L622 342L613 310" stroke="#d96d45" stroke-width="9"/>
            <path d="M612 312L603 288Q604 279 618 279H640" stroke="#36544a" stroke-width="7"/>
            <path d="M629 279H649" stroke="#ac7954" stroke-width="9"/>
            <path d="M454 350L445 329" stroke="#557467" stroke-width="7"/>
            <path d="M424 328Q444 323 473 328" stroke="#365149" stroke-width="13"/>
            <path d="M278 418A80 80 0 0 1 407 389M627 393A80 80 0 0 1 759 423" stroke="#f5e3bd" stroke-width="5"/>
            <path d="M270 400H324L338 416" stroke="#557467" stroke-width="5"/>
            <path d="M282 401L350 450M316 401L350 450" stroke="#557467" stroke-width="2"/>
            <path d="M632 288Q665 298 650 356" stroke="#587369" stroke-width="2"/>
          </g>
          <circle cx="350" cy="450" r="9" fill="#36574c"/><circle cx="684" cy="450" r="9" fill="#36574c"/>
          <circle cx="509" cy="443" r="21" fill="#f1d99e" stroke="#36574c" stroke-width="4"/>
          <g id="crank"><path d="M-30 0H30" stroke="#36574c" stroke-width="6" stroke-linecap="round"/></g>
          <g id="pelican">
            <!-- Tail, pear-shaped body and curved neck. -->
            <path d="M440 282L386 267Q390 302 441 307" fill="#f7f5df" stroke="#36574c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M451 320C415 312 415 267 445 251C467 238 487 233 501 211C512 194 507 168 526 152C542 137 573 146 581 166C590 190 572 208 557 225C548 237 550 266 535 290C521 316 486 330 451 320Z" fill="#fffbea" stroke="#36574c" stroke-width="3"/>
            <path d="M527 202C536 222 526 245 512 263C498 280 489 305 455 311C482 326 519 312 532 287C547 261 540 240 553 221Z" fill="#e2e7cf"/>
            <path d="M445 269C461 249 490 253 516 270C540 287 567 288 602 276Q615 274 622 283C588 308 557 314 522 297C496 303 466 296 445 269Z" fill="#f7f5df" stroke="#36574c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M460 269Q486 274 502 285M468 263Q490 266 509 279" fill="none" stroke="#b6c6ae" stroke-width="2.5" stroke-linecap="round"/>
            <!-- A long bill with the unmistakable pelican throat pouch. -->
            <path d="M571 181L699 193Q676 223 635 225Q593 225 568 195Z" fill="#e9b45c" stroke="#36574c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M575 181Q634 176 704 192Q708 198 697 200L571 194Z" fill="#f4cc74" stroke="#36574c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M588 201Q625 220 665 210" fill="none" stroke="#d59a4b" stroke-width="2" stroke-linecap="round"/>
            <circle cx="560" cy="174" r="5" fill="#294b45"/><circle cx="561.5" cy="172.5" r="1.5" fill="#fff"/>
            <path d="M549 161Q555 157 562 160" fill="none" stroke="#36574c" stroke-width="2.5" stroke-linecap="round"/>
            <ellipse cx="564" cy="191" rx="7" ry="4" fill="#ebba8b" opacity=".65"/>
            <!-- Cap and windblown scarf. -->
            <path d="M513 150Q509 121 537 118Q565 116 573 145Z" fill="#558d77" stroke="#36574c" stroke-width="3"/>
            <path d="M510 149Q546 139 584 145Q589 152 577 154H515Z" fill="#365e50" stroke="#36574c" stroke-width="2"/>
            <path d="M537 121Q551 128 552 141" fill="none" stroke="#8fb198" stroke-width="2"/><circle cx="536" cy="118" r="4" fill="#365e50"/>
            <path id="scarf-tail" d="M510 221Q474 208 451 222L414 208L426 231Q474 240 518 230Z" fill="#de704a" stroke="#36574c" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M513 210Q528 219 546 220L542 232Q524 233 507 221Z" fill="#e98251" stroke="#36574c" stroke-width="2.5"/>
            <path d="M517 216L516 225M531 220L529 231" stroke="#f5be78" stroke-width="3"/>
          </g>
          <path id="leg-front" d="M482 312L533 362L539 443" fill="none" stroke="#ecb658" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="foot-front" fill="#e9ac48" stroke="#bd8738" stroke-width="1.5" stroke-linejoin="round"/>
          <g id="pedal-front"><path d="M-12 5H13" stroke="#36574c" stroke-width="6" stroke-linecap="round"/></g>
          <g id="pedal-back"><path d="M-12 5H13" stroke="#36574c" stroke-width="5" stroke-linecap="round"/></g>
          <circle cx="509" cy="443" r="5" fill="#36574c"/>
        </g>
        <g id="foreground" fill="none" stroke="#7e9279" stroke-width="4" stroke-linecap="round"><path d="M78 620q-2-34-23-48m23 48q12-47 29-57m-29 57q26-26 40-26"/><path d="M934 620q-5-21-17-30m17 30q3-38 19-49"/></g>
        <text x="500" y="590" text-anchor="middle" fill="#5a7466" font-size="10" letter-spacing="5" font-family="monospace" opacity=".6">TAKE THE SCENIC ROUTE</text>
      </svg>
    </div>
    <div class="toolbar">
      <div class="caption"><span>01 /</span> 海岸漫游 · 永远顺风</div>
      <div class="controls">
        <label for="speed">骑行速度 <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1"><output id="speed-value" for="speed">1.0×</output></label>
        <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false">Ⅱ 暂停</button>
      </div>
    </div>
    <footer><span>A SMALL LOOP, A LONG WEEKEND.</span><span>DRAWN IN SVG · MADE FOR DAYDREAMING</span></footer>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const parts = Object.fromEntries(['rider','shadow','spokes-back','spokes-front','crank','leg-front','leg-back','foot-front','foot-back','pedal-front','pedal-back','clouds','wave','road','plants','foreground','scarf-tail','sailboat','bird1','bird2'].map(id => [id, byId(id)]));
    let playing = true, speed = 1, elapsed = 0, previous = null;
    const toggle = byId('toggle');
    toggle.addEventListener('click', () => {
      playing = !playing;
      toggle.textContent = playing ? 'Ⅱ 暂停' : '▷ 继续';
      toggle.setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
      toggle.setAttribute('aria-pressed', String(!playing));
    });
    byId('speed').addEventListener('input', event => {
      speed = Number(event.target.value);
      byId('speed-value').textContent = speed.toFixed(1) + '×';
    });
    // Two-segment inverse kinematics keeps each webbed foot on its pedal.
    function leg(side, angle, hipX, hipY) {
      const x = 509 + 30 * Math.cos(angle), y = 443 + 30 * Math.sin(angle);
      const dx = x - hipX, dy = y - hipY, distance = Math.hypot(dx, dy);
      const upper = 87, lower = 88;
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + dx * along / distance + dy * bend / distance;
      const kneeY = hipY + dy * along / distance - dx * bend / distance;
      parts['leg-' + side].setAttribute('d', `M${hipX} ${hipY} Q${kneeX} ${kneeY} ${kneeX} ${kneeY} L${x} ${y-4}`);
      parts['foot-' + side].setAttribute('d', `M${x-5} ${y-9} Q${x+2} ${y-12} ${x+8} ${y-5} L${x+23} ${y+1} L${x+13} ${y+3} L${x+7} ${y+1} L${x-8} ${y+2}Z`);
      parts['pedal-' + side].setAttribute('transform', `translate(${x} ${y})`);
    }
    function draw(t) {
      const angle = t * 3.1, degrees = angle * 180 / Math.PI;
      const bob = Math.sin(angle * 2) * 1.6;
      parts.rider.setAttribute('transform', `translate(0 ${bob})`);
      parts.shadow.setAttribute('rx', 230 + bob * 2);
      parts['spokes-back'].setAttribute('transform', `rotate(${degrees * 1.65})`);
      parts['spokes-front'].setAttribute('transform', `rotate(${degrees * 1.65})`);
      parts.crank.setAttribute('transform', `translate(509 443) rotate(${degrees})`);
      leg('back', angle + Math.PI, 466, 313);
      leg('front', angle, 482, 312);
      parts.clouds.setAttribute('transform', `translate(${-((t * 9) % 820)} 0)`);
      parts.wave.setAttribute('patternTransform', `translate(${-((t * 18) % 160)} 0)`);
      parts.road.setAttribute('patternTransform', `translate(${-((t * 130) % 220)} 0)`);
      parts.plants.setAttribute('transform', `translate(${-((t * 130) % 1030)} 0)`);
      parts.foreground.setAttribute('transform', `translate(${-((t * 185) % 1100)} 0)`);
      parts['scarf-tail'].setAttribute('d', `M510 221Q474 ${208 + Math.sin(angle * 1.6) * 5} 451 ${222 + Math.sin(angle * 1.6 - 1) * 7}L414 ${208 + Math.sin(angle * 1.6 - 2) * 9}L426 ${231 + Math.sin(angle * 1.6 - 2) * 9}Q474 ${240 + Math.sin(angle * 1.6) * 4} 518 230Z`);
      parts.sailboat.setAttribute('transform', `translate(${843 - ((t * 6) % 1150)} ${354 + Math.sin(t * 1.5) * 2})`);
      parts.bird1.setAttribute('transform', `translate(${Math.sin(t * .4) * 15} ${Math.sin(t * 2) * 3})`);
      parts.bird2.setAttribute('transform', `translate(${Math.sin(t * .4 - 1) * 12} ${Math.sin(t * 2 - 1) * 3})`);
    }
    // Repeat scenery beyond the canvas for seamless horizontal travel.
    for (const [id, spacing, count] of [['clouds',820,2],['plants',1030,1],['foreground',1100,1]]) {
      const group = parts[id], originals = Array.from(group.children);
      for (let i = 1; i <= count; i++) {
        const copy = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        copy.setAttribute('transform', `translate(${spacing * i} 0)`);
        originals.forEach(node => copy.appendChild(node.cloneNode(true)));
        group.appendChild(copy);
      }
    }
    function frame(now) {
      if (previous !== null && playing) elapsed += Math.min((now - previous) / 1000, .05) * speed;
      previous = now;
      draw(elapsed);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
